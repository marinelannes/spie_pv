# PostgreSQL local pour le développement (optionnel : sans Docker, l'API peut tourner sur PGlite,
# voir DATABASE_URL dans apps/api/.env.example).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: spie
      POSTGRES_PASSWORD: spie
      POSTGRES_DB: spiepv
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
